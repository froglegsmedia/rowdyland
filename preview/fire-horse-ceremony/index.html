<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="robots" content="noindex,nofollow">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>The Fire Horse Ceremony | Rowdyland</title>
    <meta name="description" content="The Fire Horse Ceremony. Fire Horse Plaza, Rowdyland.">
    <meta name="theme-color" content="#070504">
    <link rel="icon" href="/favicon.ico?v=2" sizes="any">
    <link rel="icon" href="/favicon-32.png?v=2" sizes="32x32" type="image/png">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2">
    <link rel="preload" href="fonts/Cinzel.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="art/horse-head-gold.svg?v=1" as="image" type="image/svg+xml">
    <link rel="stylesheet" href="ceremony.css?v=2">
  </head>
  <body>
    <canvas class="embers" aria-hidden="true"></canvas>

    <header class="fc-top">
      <a class="back" href="/fire-horse-plaza/">&#8592; Fire Horse Plaza</a>
      <a class="mini-cta" href="#tickets">Tickets</a>
    </header>

    <main>
      <section class="hero">
        <div class="flames" aria-hidden="true"></div>
        <div class="emblem"><img src="art/horse-head-gold.svg?v=1" width="1563" height="3287" alt="The Rowdyland horse head emblem in gold"></div>
        <p class="kicker">Fire Horse Plaza</p>
        <h1><span>The</span> Fire Horse Ceremony</h1>
        <div class="rule" aria-hidden="true"><i></i></div>
      </section>

      <section class="cta" id="tickets">
        <div class="flames" aria-hidden="true"></div>
        <h2>Join the ceremony</h2>
        <a class="big-cta" href="#reserve" data-reserve>Get your tickets now!</a>
      </section>
    </main>

    <div class="sheet-wrap" id="reserve" role="dialog" aria-modal="true" aria-labelledby="reserve-title" hidden><div class="poster reserve-poster"><button type="button" class="sheet-close" aria-label="Close">&#215;</button><p class="poster-kicker">Tickets coming soon</p><h2 id="reserve-title">Reserve your ticket</h2><p class="poster-note">Drop your email and you'll be the first to know when tickets go on sale.</p><form class="signup" onsubmit="var n=this.previousElementSibling;if(n&&n.classList.contains('poster-note'))n.hidden=true" action="https://app.kit.com/forms/9130714/subscriptions" method="post" target="_blank"><input type="hidden" name="fields[signup_source]" value="tickets"><input type="email" name="email_address" placeholder="Enter your email" aria-label="Email address" autocomplete="email" required><button type="submit" class="big-cta small">Reserve my spot</button><p class="signup-msg" role="status" aria-live="polite"></p></form></div></div>

    <script src="ceremony.js?v=1"></script>
  </body>
</html>
