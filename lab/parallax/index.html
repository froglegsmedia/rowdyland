<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>Rowdyland</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#140a06;touch-action:none}
#scene{position:fixed;inset:0;perspective:1100px;overflow:hidden}
.L{position:absolute;inset:-8%;will-change:transform;pointer-events:none}
#sky{background:url(../../fire-horse-plaza/art/plaza-bg.webp) center/cover;filter:blur(3px) brightness(.55) sepia(.4)}
#sky:after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% 20%,rgba(255,170,60,.25),rgba(20,8,4,.8) 75%)}
#groundwrap{position:absolute;left:50%;top:54%;width:min(150vw,118vh);aspect-ratio:1600/1067;transform-style:preserve-3d;pointer-events:auto}
#ground{position:absolute;inset:0;background:url(../../assets/rowdyland-map.webp) center/100% 100%;box-shadow:0 40px 80px #000;border-radius:6px}
.zone{position:absolute;display:block;border-radius:10px}
.zone:hover{background:rgba(255,220,140,.18);box-shadow:0 0 22px 6px rgba(255,200,90,.5)}
.prop{position:absolute;filter:drop-shadow(0 18px 14px rgba(0,0,0,.6))}
#fg{inset:-12%}
.lan{position:absolute;top:-2%;width:9vmin;animation:sw 3s ease-in-out infinite alternate;transform-origin:top}
@keyframes sw{to{transform:rotate(6deg)}}
.em{position:absolute;width:3vmin;opacity:.85;animation:up 7s linear infinite}
@keyframes up{from{transform:translateY(0)}to{transform:translateY(-110vh);opacity:0}}
#grain{position:fixed;inset:0;pointer-events:none;opacity:.18;mix-blend-mode:overlay;background:repeating-radial-gradient(#000 0 1px,transparent 1px 3px)}
h1{position:fixed;left:0;right:0;top:2vh;margin:0;text-align:center;font:900 clamp(28px,6vw,64px)/1 Georgia,serif;color:#f6d27a;letter-spacing:.06em;text-shadow:0 3px 0 #5a1d08,0 0 24px rgba(255,140,40,.6);pointer-events:none;z-index:5}
#tilt{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);z-index:6;padding:10px 18px;border:2px solid #f6d27a;background:#3a1408;color:#f6d27a;font:700 15px Georgia;border-radius:30px;display:none}
</style></head><body>
<div id="scene">
 <div class="L" id="sky" data-d="0.15"></div>
 <div class="L" id="mid" data-d="0.45">
  <img class="prop" src="../../carnival/art/ferris.webp" style="left:6%;top:6%;width:24vmin" alt="">
  <img class="prop" src="../../camping/art/tents.webp" style="right:4%;top:10%;width:28vmin" alt="">
 </div>
 <div id="groundwrap" data-d="0.6">
  <div id="ground">
   <a class="zone" href="../../frogville/" style="left:47.6%;top:26.4%;width:15.4%;height:27.8%" aria-label="Frogville"></a>
   <a class="zone" href="../../stables/" style="left:15.3%;top:5.4%;width:9.1%;height:13.4%" aria-label="Stables"></a>
   <a class="zone" href="../../main-stage/" style="left:31.7%;top:4.5%;width:14.2%;height:8%" aria-label="Main Stage"></a>
   <a class="zone" href="../../jam-tent/" style="left:54.1%;top:6.7%;width:8.5%;height:19%" aria-label="Jam Tent"></a>
   <a class="zone" href="../../pony-palace/" style="left:15.4%;top:26.4%;width:14.4%;height:29%" aria-label="Pony Palace"></a>
   <a class="zone" href="../../fire-horse-plaza/" style="left:32.2%;top:30%;width:13.2%;height:25%" aria-label="Fire Horse Plaza"></a>
   <a class="zone" href="../../carnival/" style="left:15.6%;top:55%;width:14.2%;height:17.5%" aria-label="Carnival"></a>
   <a class="zone" href="../../merch/" style="left:30.8%;top:62.5%;width:6.9%;height:6.3%" aria-label="Merch"></a>
   <a class="zone" href="../../movie-theater/" style="left:39.9%;top:62.6%;width:6.7%;height:6%" aria-label="Picture Show"></a>
   <a class="zone" href="../../saloon-stage/" style="left:48.3%;top:55%;width:14.2%;height:17.5%" aria-label="Saloon Stage"></a>
   <a class="zone" href="../../camping/#tent" style="left:2%;top:5%;width:11.7%;height:69.7%" aria-label="Tent Camping"></a>
   <a class="zone" href="../../camping/#rv" style="left:64%;top:5%;width:12.7%;height:69.7%" aria-label="RV Camping"></a>
  </div>
  <img class="prop" src="../../fire-horse-plaza/art/statue.webp" style="left:33%;top:-6%;width:12%;transform:translateZ(60px) rotateX(-38deg);transform-origin:bottom;pointer-events:none" alt="">
 </div>
 <div class="L" id="fg" data-d="1.2"></div>
</div>
<div id="grain"></div>
<h1>ROWDYLAND</h1>
<button id="tilt">Tilt</button>
<script>
const fg=document.getElementById('fg');
[8,24,40,60,76,92].forEach((x,i)=>{const l=new Image();l.src='../../camping/art/lantern.svg';l.className='lan';l.style.left=x+'%';l.style.animationDelay=(-i*.7)+'s';fg.appendChild(l)});
for(let i=0;i<14;i++){const e=new Image();e.src='../../fire-horse-plaza/art/ember.svg';e.className='em';e.style.left=Math.random()*100+'%';e.style.top=(80+Math.random()*40)+'%';e.style.animationDelay=(-Math.random()*7)+'s';fg.appendChild(e)}
let tx=0,ty=0,x=0,y=0,input=false,t0=performance.now();
const layers=[...document.querySelectorAll('[data-d]')],gw=document.getElementById('groundwrap');
addEventListener('mousemove',e=>{input=true;tx=e.clientX/innerWidth*2-1;ty=e.clientY/innerHeight*2-1});
let dr=null;addEventListener('pointerdown',e=>{if(e.pointerType!='mouse')dr=[e.clientX,e.clientY,tx,ty]});
addEventListener('pointermove',e=>{if(dr){input=true;tx=Math.max(-1,Math.min(1,dr[2]+(e.clientX-dr[0])/150));ty=Math.max(-1,Math.min(1,dr[3]+(e.clientY-dr[1])/150))}});
addEventListener('pointerup',()=>dr=null);
function ori(e){if(e.gamma==null)return;input=true;tx=Math.max(-1,Math.min(1,e.gamma/25));ty=Math.max(-1,Math.min(1,(e.beta-45)/25))}
const b=document.getElementById('tilt');
if(window.DeviceOrientationEvent&&typeof DeviceOrientationEvent.requestPermission=='function'){b.style.display='block';b.onclick=()=>DeviceOrientationEvent.requestPermission().then(s=>{if(s=='granted'){addEventListener('deviceorientation',ori);b.remove()}})}
else addEventListener('deviceorientation',ori);
(function f(n){const s=(n-t0)/1000,ix=input?0:Math.sin(s*.5)*.5,iy=input?0:Math.cos(s*.37)*.3;
x+=(tx+ix-x)*.08;y+=(ty+iy-y)*.08;
layers.forEach(l=>{const d=+l.dataset.d,px=-x*d*40,py=-y*d*25;
 l.style.transform=l===gw?`translate(-50%,-50%) translate(${px}px,${py}px) rotateX(${38+y*6}deg) rotateZ(${x*3}deg)`:`translate(${px}px,${py}px)`});
requestAnimationFrame(f)})(t0);
</script></body></html>
