<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><meta name="robots" content="noindex">
<title>Rowdyland</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#140a06;touch-action:none;-webkit-user-select:none;user-select:none}
#scene{position:fixed;inset:0;perspective:1400px;overflow:hidden}
.L{position:absolute;inset:-8%;will-change:transform;pointer-events:none}
#sky{background:url(../../fire-horse-plaza/art/plaza-bg.webp) center/cover;filter:blur(3px) brightness(.5) sepia(.4)}
#sky:after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% 20%,rgba(255,170,60,.25),rgba(20,8,4,.85) 75%)}
#cam{position:absolute;left:50%;top:50%;transform-style:preserve-3d;will-change:transform}
#ground{position:absolute;left:0;top:0;transform-origin:50% 50%;transform-style:preserve-3d;background:url(../../assets/rowdyland-map.webp) center/100% 100%;box-shadow:0 40px 90px #000;border-radius:6px}
.zone{position:absolute;display:block;border-radius:10px;cursor:pointer;transition:background .2s,box-shadow .2s}
.zone:hover,.zone.on{background:rgba(255,220,140,.14);box-shadow:0 0 22px 6px rgba(255,200,90,.45)}
.zone.on{background:none;box-shadow:inset 0 0 0 2px rgba(246,210,122,.6)}
.life{position:absolute;pointer-events:none;transform-style:preserve-3d;opacity:0;transition:opacity .5s}
.life.on{opacity:1}
.life .p{position:absolute;bottom:0;transform-origin:50% 100%;filter:drop-shadow(0 .4vmin .5vmin rgba(0,0,0,.7));transform:scaleY(0) translateZ(0);transition:transform .7s cubic-bezier(.2,1.4,.4,1)}
.life.on .p{transform:scaleY(1) translateZ(var(--z,0px))}
.life .bg{position:absolute;inset:0;background-size:cover;background-position:center;border-radius:8px;opacity:.92;mask-image:radial-gradient(ellipse at center,#000 55%,transparent 75%);-webkit-mask-image:radial-gradient(ellipse at center,#000 55%,transparent 75%)}
.bob{animation:bob 1.1s ease-in-out infinite alternate}
@keyframes bob{to{translate:0 -8%}}
.sway{animation:swy 1.6s ease-in-out infinite alternate}
@keyframes swy{from{rotate:-4deg}to{rotate:4deg}}
.spin{animation:spn 14s linear infinite}
@keyframes spn{to{rotate:360deg}}
.flick{animation:flk .25s steps(2) infinite alternate}
@keyframes flk{to{filter:brightness(1.35) drop-shadow(0 0 1vmin #ff8a20)}}
.beam{position:absolute;bottom:40%;width:8%;height:160%;transform-origin:50% 100%;background:linear-gradient(to top,rgba(255,240,200,.55),transparent);mix-blend-mode:screen;animation:bm 3s ease-in-out infinite alternate;filter:blur(2px)}
@keyframes bm{from{rotate:-22deg}to{rotate:22deg}}
.ember{position:absolute;width:6%;animation:rise 3.5s linear infinite}
@keyframes rise{from{translate:0 0;opacity:1}to{translate:0 -260%;opacity:0}}
.poi{position:absolute;pointer-events:auto;width:2.2vmin;height:2.2vmin;min-width:16px;min-height:16px;margin:-8px;border-radius:50%;background:#f6d27a;border:2px solid #5a1d08;box-shadow:0 0 0 0 rgba(246,210,122,.8);animation:pl 1.6s infinite;cursor:pointer;transform:translateZ(40px);padding:0}
@keyframes pl{to{box-shadow:0 0 0 12px rgba(246,210,122,0)}}
.poi span{position:absolute;left:50%;bottom:150%;transform:translateX(-50%);white-space:nowrap;background:#3a1408;color:#f6d27a;font:700 12px Georgia,serif;padding:5px 9px;border:1.5px solid #f6d27a;border-radius:14px;display:none}
.poi.open span{display:block}
#grain{position:fixed;inset:0;pointer-events:none;opacity:.16;mix-blend-mode:overlay;background:repeating-radial-gradient(#000 0 1px,transparent 1px 3px)}
#fg{inset:-12%}
.lan{position:absolute;top:-2%;width:8vmin;animation:sw 3s ease-in-out infinite alternate;transform-origin:top}
@keyframes sw{to{transform:rotate(6deg)}}
.em{position:absolute;width:2.6vmin;opacity:.85;animation:up 7s linear infinite}
@keyframes up{from{transform:translateY(0)}to{transform:translateY(-110vh);opacity:0}}
h1{position:fixed;left:0;right:0;top:2vh;margin:0;text-align:center;font:900 clamp(26px,5vw,56px)/1 Georgia,serif;color:#f6d27a;letter-spacing:.06em;text-shadow:0 3px 0 #5a1d08,0 0 24px rgba(255,140,40,.6);pointer-events:none;z-index:5;transition:opacity .4s}
.ui{position:fixed;z-index:7;font:700 15px Georgia,serif;color:#f6d27a;background:#3a1408;border:2px solid #f6d27a;border-radius:30px}
#zb{right:14px;bottom:14px;display:flex;flex-direction:column;border-radius:12px;overflow:hidden}
#zb button{all:unset;cursor:pointer;width:42px;height:40px;text-align:center;font:700 22px Georgia;color:#f6d27a}
#zb button+button{border-top:1px solid #f6d27a55}
#tilt{bottom:16px;left:16px;padding:10px 16px;display:none}
#enter{left:50%;bottom:22px;transform:translate(-50%,30px);padding:12px 24px;text-decoration:none;opacity:0;pointer-events:none;transition:.35s;box-shadow:0 6px 0 #5a1d08,0 0 24px rgba(255,140,40,.5)}
#enter.on{opacity:1;pointer-events:auto;transform:translate(-50%,0)}
#back{top:14px;left:14px;padding:8px 14px;opacity:0;pointer-events:none;transition:.3s;cursor:pointer}
#back.on{opacity:1;pointer-events:auto}
</style></head><body>
<div id="scene">
 <div class="L" id="sky" data-d="0.15"></div>
 <div id="cam"><div id="ground"></div></div>
 <div class="L" id="fg" data-d="1.2"></div>
</div>
<div id="grain"></div>
<h1 id="ttl">ROWDYLAND</h1>
<button id="back" class="ui">&#8592; Map</button>
<a id="enter" class="ui" href="#">Enter</a>
<div id="zb" class="ui"><button id="zi" aria-label="Zoom in">+</button><button id="zo" aria-label="Zoom out">&#8722;</button><button id="zr" aria-label="Reset" style="font-size:16px">&#8634;</button></div>
<button id="tilt" class="ui">Tilt</button>
<script>
const A='../../';
// exact zone rects from index.html (left, top, width, height in %)
const Z=[
 {id:'frogville',n:'Frogville',h:'frogville/',r:[47.6,26.4,15.4,27.8],
  bg:'frogville/art/bayou-bg.webp',
  props:[['frogville/art/cypress.webp',2,24,0],['frogville/art/stage.webp',22,48,10],['frogville/art/jukebox.webp',70,18,20,'sway'],['frogville/art/dancer1.webp',40,13,30,'bob'],['frogville/art/dancer2.webp',56,13,30,'bob'],['frogville/art/frog-hop.webp',8,16,40,'bob']],
  poi:[[35,55,'Lily Pad Porch Stage'],[78,40,'Boil Shack Bar'],[15,75,'Swamp Games']]},
 {id:'fire',n:'Fire Horse Plaza',h:'fire-horse-plaza/',r:[32.2,30,13.2,25],
  bg:'fire-horse-plaza/art/plaza-bg.webp',
  props:[['fire-horse-plaza/art/notes.webp',4,22,10],['fire-horse-plaza/art/hero-fire.webp',30,40,20,'flick'],['fire-horse-plaza/art/anthem.webp',74,22,10]],
  embers:1,
  poi:[[15,60,'Feed Rowdy a Note'],[50,30,'The Fire Ceremony'],[85,60,'The Anthem'],[50,85,'Revealed in Gold']]},
 {id:'main',n:'Main Stage',h:'main-stage/',r:[31.7,4.5,14.2,8],
  bg:'main-stage/art/msbg-night.webp',beams:1,
  props:[['main-stage/art/mshero.webp',20,60,0],['main-stage/art/pit.webp',2,26,25,'bob'],['main-stage/art/deck.webp',74,24,15]],
  poi:[[25,70,'The Front Row Pit'],[85,60,'VIP Viewing Deck'],[55,30,'Lineup & Set Times']]},
 {id:'jam',n:'Jam Tent',h:'jam-tent/',r:[54.1,6.7,8.5,19],
  bg:'jam-tent/art/tent-bg.webp',
  props:[['jam-tent/art/tent.webp',8,84,0],['jam-tent/art/jam.webp',10,44,20,'bob'],['jam-tent/art/rave.webp',56,38,25,'sway'],['jam-tent/art/bull.webp',20,40,35,'sway']],
  poi:[[30,40,'Open Jam Circle'],[72,45,'Late Night DJ Rave'],[40,80,'Mud Pit Bull Ride']]},
 {id:'stables',n:'The Stables',h:'stables/',r:[15.3,5.4,9.1,13.4],bg:'stables/art/stables-bg.webp',
  props:[['stables/art/hero.webp',10,40,10,'bob'],['stables/art/jump.webp',52,42,20,'bob']]},
 {id:'pony',n:'Pony Palace',h:'pony-palace/',r:[15.4,26.4,14.4,29]},
 {id:'carnival',n:'The Carnival',h:'carnival/',r:[15.6,55,14.2,17.5],bg:'carnival/art/carnival-bg.webp',
  props:[['carnival/art/ferris.webp',10,48,0,'spin'],['carnival/art/carousel.webp',58,36,20,'sway']]},
 {id:'merch',n:'Merch Booth',h:'merch/',r:[30.8,62.5,6.9,6.3]},
 {id:'movie',n:'The Picture Show',h:'movie-theater/',r:[39.9,62.6,6.7,6]},
 {id:'saloon',n:'Saloon Stage',h:'saloon-stage/',r:[48.3,55,14.2,17.5]},
 {id:'tent',n:'Tent Camping',h:'camping/#tent',r:[2,5,11.7,69.7]},
 {id:'rv',n:'RV Camping',h:'camping/#rv',r:[64,5,12.7,69.7]}];
const G=document.getElementById('ground'),cam=document.getElementById('cam');
const MW=1600,MH=1067;
Z.forEach(z=>{
 const [l,t,w,h]=z.r,a=document.createElement('a');a.className='zone';a.href=A+z.h;a.setAttribute('aria-label',z.n);
 Object.assign(a.style,{left:l+'%',top:t+'%',width:w+'%',height:h+'%'});
 a.onclick=e=>{e.preventDefault();if(moved)return;fly(z)};G.appendChild(a);z.el=a;
 if(!z.props)return;
 const L=document.createElement('div');L.className='life';
 // life box: square-ish stage centered on zone, a bit larger than zone for thin zones
 const cx=l+w/2,cy=t+h/2,s=Math.max(w,h*MH/MW)*1.15;const bw=s,bh=s*MW/MH*.72;
 Object.assign(L.style,{left:(cx-bw/2)+'%',top:(cy-bh/2)+'%',width:bw+'%',height:bh+'%'});
 if(z.bg){const b=document.createElement('div');b.className='bg';b.style.backgroundImage=`url(${A+z.bg})`;L.appendChild(b)}
 if(z.beams)[15,35,65,85].forEach((x,i)=>{const b=document.createElement('div');b.className='beam';b.style.left=x+'%';b.style.animationDelay=(-i*.8)+'s';L.appendChild(b)});
 z.props.forEach(([src,x,wd,zz,an],i)=>{const w2=document.createElement('div');w2.className='p';w2.style.cssText+=`left:${x}%;width:${wd}%;--z:${zz}px;bottom:${4+ (i%2)*3}%;transition-delay:${i*.08}s`;w2.dataset.z=zz;
  const im=new Image();im.src=A+src;im.style.width='100%';im.style.display='block';if(an){im.className=an;im.style.animationDelay=(-i*.3)+'s';if(an=='spin')im.style.transformOrigin='50% 42%'}w2.appendChild(im);L.appendChild(w2)});
 if(z.embers)for(let i=0;i<10;i++){const e=new Image();e.src=A+'fire-horse-plaza/art/ember.svg';e.className='ember';e.style.left=(30+Math.random()*40)+'%';e.style.top=(40+Math.random()*30)+'%';e.style.animationDelay=(-Math.random()*3.5)+'s';L.appendChild(e)}
 (z.poi||[]).forEach(([x,y,txt])=>{const p=document.createElement('button');p.className='poi';p.style.left=x+'%';p.style.top=y+'%';p.innerHTML='<span></span>';p.firstChild.textContent=txt;p.setAttribute('aria-label',txt);
  p.onclick=e=>{e.stopPropagation();const o=p.classList.contains('open');L.querySelectorAll('.poi').forEach(q=>q.classList.remove('open'));if(!o)p.classList.add('open')};L.appendChild(p)});
 G.appendChild(L);z.life=L;});
// fg
const fg=document.getElementById('fg');
[8,30,70,92].forEach((x,i)=>{const l=new Image();l.src=A+'camping/art/lantern.svg';l.className='lan';l.style.left=x+'%';l.style.animationDelay=(-i*.7)+'s';fg.appendChild(l)});
for(let i=0;i<10;i++){const e=new Image();e.src=A+'fire-horse-plaza/art/ember.svg';e.className='em';e.style.left=Math.random()*100+'%';e.style.top=(80+Math.random()*40)+'%';e.style.animationDelay=(-Math.random()*7)+'s';fg.appendChild(e)}
// camera
let base=1,S=1,X=0,Y=0,tS=1,tX=0,tY=0,px=0,py=0,ppx=0,ppy=0,input=false,moved=false,active=null;
function fit(){const m=innerWidth<700;const W=innerWidth*(m?1.0:.86),H=innerHeight*(m?.7:.74);base=Math.min(W/MW,H/MH/ .82);G.style.width=MW+'px';G.style.height=MH+'px';G.style.left=-MW/2+'px';G.style.top=-MH/2+'px'}
fit();addEventListener('resize',fit);
const clampS=v=>Math.max(1,Math.min(7,v));
function zoomAt(f,cx,cy){const nS=clampS(tS*f);const k=nS/tS;const ox=cx-innerWidth/2,oy=cy-innerHeight/2;tX=ox-(ox-tX)*k;tY=oy-(oy-tY)*k;tS=nS;if(nS==1){tX=0;tY=0}}
function fly(z){const [l,t,w,h]=z.r;const zx=(l+w/2)/100*MW-MW/2,zy=(t+h/2)/100*MH-MH/2;
 const zs=Math.max(w,h*MH/MW)*1.25/100*MW;tS=clampS(Math.min(innerWidth*(innerWidth<700?.95:.6),innerHeight*.75*MW/MH)/zs/base);tX=-zx*base*tS;tY=-zy*base*tS}
function reset(){tS=1;tX=0;tY=0}
const zb=(id,fn)=>document.getElementById(id).onclick=fn;
zb('zi',()=>zoomAt(1.5,innerWidth/2,innerHeight/2));zb('zo',()=>zoomAt(1/1.5,innerWidth/2,innerHeight/2));zb('zr',reset);zb('back',reset);
addEventListener('wheel',e=>{e.preventDefault();zoomAt(Math.exp(-e.deltaY*.0015),e.clientX,e.clientY)},{passive:false});
const pts=new Map();let last=null,dist0=0,downAt=null;
addEventListener('pointerdown',e=>{pts.set(e.pointerId,[e.clientX,e.clientY]);downAt=[e.clientX,e.clientY];moved=false;if(pts.size==2){const [a,b]=[...pts.values()];dist0=Math.hypot(a[0]-b[0],a[1]-b[1])}});
addEventListener('pointermove',e=>{if(e.pointerType=='mouse'){input=true;ppx=e.clientX/innerWidth*2-1;ppy=e.clientY/innerHeight*2-1}
 if(!pts.has(e.pointerId))return;const pr=pts.get(e.pointerId);pts.set(e.pointerId,[e.clientX,e.clientY]);
 if(downAt&&Math.hypot(e.clientX-downAt[0],e.clientY-downAt[1])>8)moved=true;
 if(pts.size==2){const [a,b]=[...pts.values()],d=Math.hypot(a[0]-b[0],a[1]-b[1]);if(dist0){zoomAt(d/dist0,(a[0]+b[0])/2,(a[1]+b[1])/2);S=tS;}dist0=d}
 else if(moved&&tS>1){tX+=e.clientX-pr[0];tY+=e.clientY-pr[1];X=tX;Y=tY}
 else if(moved&&e.pointerType!='mouse'){input=true;ppx=Math.max(-1,Math.min(1,ppx+(e.clientX-pr[0])/150));ppy=Math.max(-1,Math.min(1,ppy+(e.clientY-pr[1])/150))}});
const up=e=>{pts.delete(e.pointerId);if(pts.size<2)dist0=0};addEventListener('pointerup',up);addEventListener('pointercancel',up);
addEventListener('click',e=>{if(!e.target.closest('.poi'))document.querySelectorAll('.poi.open').forEach(q=>q.classList.remove('open'))});
function ori(e){if(e.gamma==null)return;input=true;ppx=Math.max(-1,Math.min(1,e.gamma/25));ppy=Math.max(-1,Math.min(1,(e.beta-45)/25))}
const tb=document.getElementById('tilt');
if(window.DeviceOrientationEvent&&typeof DeviceOrientationEvent.requestPermission=='function'){tb.style.display='block';tb.onclick=()=>DeviceOrientationEvent.requestPermission().then(s=>{if(s=='granted'){addEventListener('deviceorientation',ori);tb.remove()}})}else addEventListener('deviceorientation',ori);
const enter=document.getElementById('enter'),back=document.getElementById('back'),ttl=document.getElementById('ttl');
const sky=document.getElementById('sky');let t0=performance.now(),qx=0,qy=0;
(function f(n){const s=(n-t0)/1000,ix=input?0:Math.sin(s*.5)*.5,iy=input?0:Math.cos(s*.37)*.3;
 S+=(tS-S)*.12;X+=(tX-X)*.12;Y+=(tY-Y)*.12;qx+=(ppx+ix-qx)*.08;qy+=(ppy+iy-qy)*.08;
 const k=Math.min(1,(S-1)/.8);const tilt=(1-k)*30;// flatten as we zoom in
 cam.style.transform=`translate(${X}px,${Y}px) scale(${base*S})`;
 G.style.transform=`rotateX(${tilt+qy*5*(1-k)}deg) rotateZ(${qx*3*(1-k)}deg)`;
 sky.style.transform=`translate(${-qx*6}px,${-qy*4}px) scale(${1+(S-1)*.03})`;fg.style.transform=`translate(${-qx*48}px,${-qy*30}px)`;fg.style.opacity=1-k*.6;
 // which zone is at screen center
 let cur=null;if(S>1.8){const cx=(-X)/(base*S)+MW/2,cy=(-Y)/(base*S)+MH/2,ux=cx/MW*100,uy=cy/MH*100;let best=1e9;
  Z.forEach(z=>{const [l,t,w,h]=z.r;if(ux>=l-2&&ux<=l+w+2&&uy>=t-2&&uy<=t+h+2){const d=Math.hypot(ux-l-w/2,uy-t-h/2)/(w*h);if(d<best){best=d;cur=z}}})}
 if(cur!==active){if(active){active.life&&active.life.classList.remove('on');active.el.classList.remove('on')}active=cur;
  if(cur){cur.life&&cur.life.classList.add('on');cur.el.classList.add('on');enter.textContent='Enter '+cur.n;enter.href=A+cur.h}
  enter.classList.toggle('on',!!cur)}
 back.classList.toggle('on',S>1.15);ttl.style.opacity=1-k;
 if(active&&active.life){active.life.querySelectorAll('.p').forEach(p=>{const d=+p.dataset.z/40;p.style.translate=`${-qx*d*4}px ${-qy*d*2}px`})}
 requestAnimationFrame(f)})(t0);
</script></body></html>
